<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海外ToB AI数字人产品情报站</title>
<style>
:root {
  --bg: #0b1020;
  --bg-2: #111735;
  --panel: #151c3d;
  --panel-2: #1a234d;
  --border: #2a3566;
  --text: #e6eaf5;
  --text-dim: #9ba4c7;
  --text-muted: #6b749a;
  --accent: #6366f1;
  --accent-2: #8b5cf6;
  --accent-glow: rgba(99, 102, 241, 0.15);
  --green: #10b981;
  --orange: #f59e0b;
  --red: #ef4444;
  --blue: #3b82f6;
  --tag-bg: rgba(99, 102, 241, 0.12);
  --tag-text: #a5b4fc;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
  --mono: 'SF Mono', 'JetBrains Mono', Consolas, Monaco, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 14px;
  min-height: 100vh;
}

/* Top bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11, 16, 32, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-logo {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
  color: white;
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
  min-width: 0;
}

.brand-name {
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-sub {
  font-size: 12px;
  color: var(--text-muted);
}

.topbar-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.update-time {
  font-size: 12px;
  color: var(--text-dim);
}

.update-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 6px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Tabs */
.tabs {
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
  position: sticky;
  top: 65px;
  z-index: 99;
}

.tabs-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs-inner::-webkit-scrollbar { display: none; }

.tab-btn {
  padding: 12px 18px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  position: relative;
  transition: color 0.2s;
  font-family: inherit;
}

.tab-btn:hover { color: var(--text); }

.tab-btn.active {
  color: var(--text);
}

.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 18px;
  right: 18px;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 2px 2px 0 0;
}

.tab-count {
  display: inline-block;
  padding: 1px 6px;
  background: var(--tag-bg);
  color: var(--tag-text);
  border-radius: 10px;
  font-size: 11px;
  margin-left: 6px;
  font-weight: 600;
}

/* Main content */
.main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Section header */
.section-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.section-title {
  font-size: 18px;
  font-weight: 600;
}

.section-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* Filter bar */
.filter-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
  padding: 14px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}

.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 9px 12px 9px 34px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}

.search-box input:focus {
  border-color: var(--accent);
}

.search-box-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  pointer-events: none;
  color: var(--text-muted);
}

.tag-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tag-filter {
  padding: 5px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  font-family: inherit;
}

.tag-filter:hover {
  border-color: var(--accent);
  color: var(--text);
}

.tag-filter.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.date-filter {
  display: flex;
  align-items: center;
  gap: 8px;
}

.date-filter select {
  padding: 8px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  outline: none;
}

/* Card list */
.card-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.card:hover {
  border-color: #3b4786;
  box-shadow: var(--shadow);
}

.card-header {
  padding: 16px 18px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
}

.card-header:hover .card-title { color: var(--text); }

.card-title-wrap {
  flex: 1;
  min-width: 0;
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 8px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-muted);
}

.card-date {
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-source {
  color: var(--text-dim);
}

.card-source a {
  color: var(--accent);
  text-decoration: none;
}

.card-source a:hover { text-decoration: underline; }

.card-badge {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

.badge-new { background: rgba(16, 185, 129, 0.15); color: var(--green); }
.badge-update { background: rgba(59, 130, 246, 0.15); color: var(--blue); }
.badge-price { background: rgba(245, 158, 11, 0.15); color: var(--orange); }
.badge-review { background: rgba(139, 92, 246, 0.15); color: var(--accent-2); }
.badge-policy { background: rgba(239, 68, 68, 0.15); color: var(--red); }
.badge-funding { background: rgba(16, 185, 129, 0.15); color: var(--green); }

.card-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 0 18px 14px;
}

.card-tag {
  padding: 2px 8px;
  background: var(--tag-bg);
  color: var(--tag-text);
  border-radius: 4px;
  font-size: 11px;
}

.card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.card.open .card-body {
  max-height: 2000px;
}

.card-content {
  padding: 0 18px 18px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
  margin-top: 4px;
}

.card-content p {
  margin-bottom: 10px;
  color: var(--text-dim);
  font-size: 13px;
}

.card-content p:last-child { margin-bottom: 0; }

.card-content strong {
  color: var(--text);
  font-weight: 600;
}

.card-content ul {
  list-style: none;
  padding: 0;
  margin: 8px 0;
}

.card-content ul li {
  padding: 4px 0 4px 16px;
  position: relative;
  color: var(--text-dim);
  font-size: 13px;
}

.card-content ul li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

.detail-section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}

.detail-section:first-of-type {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}

.detail-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.card-chevron {
  width: 20px;
  height: 20px;
  transition: transform 0.2s;
  flex-shrink: 0;
  margin-top: 2px;
  color: var(--text-muted);
}

.card.open .card-chevron {
  transform: rotate(180deg);
}

/* Info type labels */
.info-fact { color: var(--green); }
.info-prediction { color: var(--orange); }
.info-feedback { color: var(--accent-2); }
.info-pending { color: var(--red); }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state-icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.empty-state-text {
  font-size: 14px;
}

/* Archive section */
.archive-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.archive-item {
  padding: 14px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
}

.archive-item:hover {
  border-color: var(--accent);
  background: var(--panel-2);
}

.archive-date {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}

.archive-count {
  font-size: 12px;
  color: var(--text-muted);
}

/* Competitor tabs */
.competitor-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.competitor-tab {
  padding: 8px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.competitor-tab:hover {
  border-color: var(--accent);
  color: var(--text);
}

.competitor-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* Data center */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.stat-card {
  padding: 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  line-height: 1.2;
}

.stat-label {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.stat-source {
  font-size: 11px;
  color: var(--text-muted);
}

.stat-source a {
  color: var(--accent);
  text-decoration: none;
}

.industry-section {
  margin-bottom: 28px;
}

.industry-section h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* Footer */
.footer {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  margin-top: 40px;
}

.footer p { margin-bottom: 4px; }

/* Responsive */
@media (max-width: 768px) {
  .topbar-inner { padding: 12px 16px; }
  .tabs-inner { padding: 0 16px; }
  .main { padding: 16px; }
  .tabs { top: 60px; }
  .brand-name { font-size: 14px; }
  .brand-sub { display: none; }
  .update-time { font-size: 11px; }
  .section-title { font-size: 16px; }
  .card-header { padding: 14px 16px 10px; }
  .card-tags { padding: 0 16px 12px; }
  .card-content { padding: 0 16px 16px; }
  .stat-value { font-size: 20px; }
}

@media print {
  .topbar, .tabs, .filter-bar, .card-chevron { display: none !important; }
  .tab-panel { display: block !important; page-break-inside: avoid; }
  .card-body { max-height: none !important; }
  body { background: white; color: black; }
  .card { border-color: #ccc; }
}
</style>
</head>

</main>

<footer class="footer">

// ============ DATA ============
const DATA = {
  models: [
    {
      id: '2026-08-06-models-0',

// ============ STATE ============
let currentTab = 'models';
let activeTags = { models: [], competitors: [], industry: [] };
let activeCompetitor = 'all';

// ============ INIT ============
document.addEventListener('DOMContentLoaded', function() {
  initTabs();
  initModels();
  initCompetitors();
  initIndustry();
  initArchive();
  updateCounts();
});

// ============ TABS ============
function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      switchTab(tab);
    });
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
}

// ============ MODELS ============
function initModels() {
  renderModels();
  renderTagFilters('models');
  document.getElementById('search-models').addEventListener('input', () => renderModels());
}

function renderModels() {
  const search = document.getElementById('search-models').value.toLowerCase();
  const tags = activeTags.models;
  const list = document.getElementById('list-models');

  let items = DATA.models.filter(item => {
    if (search && !item.title.toLowerCase().includes(search) &&
        !item.summary.toLowerCase().includes(search) &&
        !item.tags.some(t => t.toLowerCase().includes(search))) return false;
    if (tags.length > 0 && !tags.some(t => item.tags.includes(t))) return false;
    return true;
  });

  list.innerHTML = items.length === 0
    ? '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">没有找到匹配的模型动态</div></div>'
    : items.map(item => renderCard(item, 'models')).join('');

  bindCardClicks();
}

// ============ COMPETITORS ============
function initCompetitors() {
  renderCompetitorTabs();
  renderCompetitors();
  renderTagFilters('competitors');
  document.getElementById('search-competitors').addEventListener('input', () => renderCompetitors());
}

function renderCompetitorTabs() {
  const products = ['all', ...new Set(DATA.competitors.map(c => c.product))];
  const tabs = document.getElementById('competitor-tabs');
  tabs.innerHTML = products.map(p => {
    const label = p === 'all' ? '全部竞品' : p;
    return `<button class="competitor-tab ${p === activeCompetitor ? 'active' : ''}" data-product="${p}">${label}</button>`;
  }).join('');
  tabs.querySelectorAll('.competitor-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCompetitor = btn.dataset.product;
      renderCompetitorTabs();
      renderCompetitors();
    });
  });
}

function renderCompetitors() {
  const search = document.getElementById('search-competitors').value.toLowerCase();
  const tags = activeTags.competitors;
  const list = document.getElementById('list-competitors');

  let items = DATA.competitors.filter(item => {
    if (activeCompetitor !== 'all' && item.product !== activeCompetitor) return false;
    if (search && !item.title.toLowerCase().includes(search) &&
        !item.summary.toLowerCase().includes(search) &&
        !item.tags.some(t => t.toLowerCase().includes(search))) return false;
    if (tags.length > 0 && !tags.some(t => item.tags.includes(t))) return false;
    return true;
  });

  list.innerHTML = items.length === 0
    ? '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">没有找到匹配的竞品动态</div></div>'
    : items.map(item => renderCard(item, 'competitors')).join('');

  bindCardClicks();
}

// ============ INDUSTRY ============
function initIndustry() {
  renderStats();
  renderIndustry();
  renderTagFilters('industry');
  document.getElementById('search-industry').addEventListener('input', () => renderIndustry());
}

function renderStats() {
  const grid = document.getElementById('stats-industry');
  grid.innerHTML = DATA.stats.map(s => `
    <div class="stat-card">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
      <div class="stat-source">来源：${s.source}</div>
    </div>
  `).join('');
}

function renderIndustry() {
  const search = document.getElementById('search-industry').value.toLowerCase();
  const tags = activeTags.industry;
  const list = document.getElementById('list-industry');

  let items = DATA.industry.filter(item => {
    if (search && !item.title.toLowerCase().includes(search) &&
        !item.summary.toLowerCase().includes(search) &&
        !item.tags.some(t => t.toLowerCase().includes(search))) return false;
    if (tags.length > 0 && !tags.some(t => item.tags.includes(t))) return false;
    return true;
  });

  list.innerHTML = items.length === 0
    ? '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">没有找到匹配的行业情报</div></div>'
    : items.map(item => renderCard(item, 'industry')).join('');

  bindCardClicks();
}

// ============ ARCHIVE ============
function initArchive() {
  renderArchive();
  document.getElementById('search-archive').addEventListener('input', () => renderArchive());
  renderMonthFilter();
  document.getElementById('archive-month').addEventListener('change', () => renderArchive());
}

function renderMonthFilter() {
  const months = [...new Set(DATA.archive.map(a => a.date.slice(0, 7)))].sort().reverse();
  const select = document.getElementById('archive-month');
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m.replace('-', '年') + '月';
    select.appendChild(opt);
  });
}

function renderArchive() {
  const search = document.getElementById('search-archive').value.toLowerCase();
  const month = document.getElementById('archive-month').value;
  const list = document.getElementById('list-archive');

  let items = DATA.archive.filter(item => {
    if (month && !item.date.startsWith(month)) return false;
    if (search && !item.date.includes(search)) return false;
    return true;
  });

  list.innerHTML = items.length === 0
    ? '<div class="empty-state"><div class="empty-state-icon">📁</div><div class="empty-state-text">没有找到匹配的归档</div></div>'
    : items.map(item => `
      <div class="archive-item" data-date="${item.date}">
        <div class="archive-date">${item.date}</div>
        <div class="archive-count">模型 ${item.models} 条 · 竞品 ${item.competitors} 条 · 行业 ${item.industry} 条</div>
      </div>
    `).join('');

  list.querySelectorAll('.archive-item').forEach(el => {
    el.addEventListener('click', () => {
      switchTab('models');
    });
  });
}

// ============ SHARED CARD RENDER ============
function renderCard(item, category) {
  const badgeClass = 'badge-' + item.badge;
  const sectionsHtml = item.sections.map(s => `
    <div class="detail-section">
      <div class="detail-label">${s.label}</div>
      ${s.content}
    </div>
  `).join('');

  return `
    <article class="card" data-id="${item.id}" data-category="${category}">
      <div class="card-header">
        <div class="card-title-wrap">
          <div class="card-title">${item.title}</div>
          <div class="card-meta">
            <span class="card-date">📅 ${item.date}</span>
            <span class="card-source">来源：<a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer">${item.source}</a></span>
            <span class="card-badge ${badgeClass}">${item.badgeText}</span>
          </div>
        </div>
        <svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <div class="card-tags">
        ${item.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
      </div>
      <div class="card-body">
        <div class="card-content">
          <p style="color:var(--text-dim);margin-bottom:12px;">${item.summary}</p>
          ${sectionsHtml}
        </div>
      </div>
    </article>
  `;
}

function bindCardClicks() {
  document.querySelectorAll('.card-header').forEach(header => {
    if (header._bound) return;
    header._bound = true;
    header.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      const card = header.closest('.card');
      card.classList.toggle('open');
    });
  });
}

// ============ TAG FILTERS ============
function renderTagFilters(category) {
  const allTags = [...new Set(DATA[category].flatMap(item => item.tags))];
  const container = document.getElementById('tag-filters-' + category);
  container.innerHTML = allTags.map(tag => `
    <span class="tag-filter ${activeTags[category].includes(tag) ? 'active' : ''}" data-tag="${tag}">${tag}</span>
  `).join('');

  container.querySelectorAll('.tag-filter').forEach(el => {
    el.addEventListener('click', () => {
      const tag = el.dataset.tag;
      const idx = activeTags[category].indexOf(tag);
      if (idx > -1) {
        activeTags[category].splice(idx, 1);
      } else {
        activeTags[category].push(tag);
      }
      renderTagFilters(category);
      if (category === 'models') renderModels();
      else if (category === 'competitors') renderCompetitors();
      else if (category === 'industry') renderIndustry();
    });
  });
}

// ============ COUNTS ============
function updateCounts() {
  document.getElementById('count-models').textContent = DATA.models.length;
  document.getElementById('count-competitors').textContent = DATA.competitors.length;
  document.getElementById('count-industry').textContent = DATA.industry.length;
  document.getElementById('count-archive').textContent = DATA.archive.length;
}
</script>
